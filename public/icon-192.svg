<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <defs>
    <radialGradient id="bgGrad192" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#060912"/>
    </radialGradient>
    <linearGradient id="prismTop192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="prismLeft192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="prismRight192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coreBeam192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow192" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad192)"/>
  <rect x="1" y="1" width="190" height="190" rx="43" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- 3D Quantum Prism Icon Centered -->
  <g transform="translate(48, 38)">
    <circle cx="48" cy="56" r="44" fill="#2563eb" opacity="0.35" filter="url(#glow192)"/>

    <!-- Faces -->
    <polygon points="48,12 84,34 48,56 12,34" fill="url(#prismTop192)"/>
    <polygon points="12,34 48,56 48,102 12,80" fill="url(#prismLeft192)"/>
    <polygon points="48,56 84,34 84,80 48,102" fill="url(#prismRight192)"/>

    <!-- Core Data Laser -->
    <path d="M48,18 L48,96" stroke="url(#coreBeam192)" stroke-width="8" stroke-linecap="round" filter="url(#glow192)"/>
    
    <!-- Central Quantum Core -->
    <circle cx="48" cy="56" r="10" fill="#ffffff" filter="url(#glow192)"/>
    <circle cx="48" cy="56" r="5.5" fill="#00f2fe"/>

    <!-- Specular Edges -->
    <polyline points="12,34 48,56 84,34" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
    <line x1="48" y1="56" x2="48" y2="102" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  </g>
</svg>
