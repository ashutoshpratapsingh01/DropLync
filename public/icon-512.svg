<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="bgGrad512" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#060912"/>
    </radialGradient>
    <linearGradient id="prismTop512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="prismLeft512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="prismRight512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coreBeam512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad512)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- 3D Quantum Prism Icon Centered -->
  <g transform="translate(128, 100)">
    <circle cx="128" cy="150" r="115" fill="#2563eb" opacity="0.35" filter="url(#glow512)"/>

    <!-- Faces -->
    <polygon points="128,32 224,90 128,150 32,90" fill="url(#prismTop512)"/>
    <polygon points="32,90 128,150 128,272 32,212" fill="url(#prismLeft512)"/>
    <polygon points="128,150 224,90 224,212 128,272" fill="url(#prismRight512)"/>

    <!-- Core Data Laser -->
    <path d="M128,48 L128,256" stroke="url(#coreBeam512)" stroke-width="22" stroke-linecap="round" filter="url(#glow512)"/>
    
    <!-- Central Quantum Core -->
    <circle cx="128" cy="150" r="26" fill="#ffffff" filter="url(#glow512)"/>
    <circle cx="128" cy="150" r="14" fill="#00f2fe"/>

    <!-- Specular Edges -->
    <polyline points="32,90 128,150 224,90" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="8"/>
    <line x1="128" y1="150" x2="128" y2="272" stroke="rgba(255,255,255,0.35)" stroke-width="8"/>
  </g>
</svg>
