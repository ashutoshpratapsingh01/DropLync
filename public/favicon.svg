<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="prismTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coreBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glowFavicon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 3D Prism on Transparent Background -->
  <g transform="translate(12, 10)">
    <circle cx="20" cy="22" r="18" fill="#2563eb" opacity="0.3" filter="url(#glowFavicon)"/>

    <!-- Faces -->
    <polygon points="20,4 35,13 20,22 5,13" fill="url(#prismTop)"/>
    <polygon points="5,13 20,22 20,40 5,31" fill="url(#prismLeft)"/>
    <polygon points="20,22 35,13 35,31 20,40" fill="url(#prismRight)"/>

    <!-- Core Data Laser -->
    <path d="M20,6 L20,38" stroke="url(#coreBeam)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowFavicon)"/>
    
    <!-- Central Quantum Core -->
    <circle cx="20" cy="22" r="4" fill="#ffffff" filter="url(#glowFavicon)"/>
    <circle cx="20" cy="22" r="2.2" fill="#00f2fe"/>

    <!-- Specular Edges -->
    <polyline points="5,13 20,22 35,13" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="20" y1="22" x2="20" y2="40" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  </g>
</svg>
